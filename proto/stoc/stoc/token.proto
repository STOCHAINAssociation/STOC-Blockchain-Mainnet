syntax = "proto3";
package stoc.stoc;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";

option go_package = "stoc/x/stoc/types";

// Token represents a fungible token on the STOC blockchain
message Token {
  option (gogoproto.equal) = true;
  
  string name = 1;
  string symbol = 2 [(gogoproto.moretags) = "yaml:\"symbol\""];
  string initial_supply = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int", 
    (gogoproto.nullable) = false
  ];
  string total_supply = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  uint32 decimals = 5;
  string logo = 6;
  
  // Wallet distributions for initial supply
  repeated WalletDistribution distributions = 7 [(gogoproto.nullable) = false];
  
  // Tax configuration
  TokenTax tax = 8 [(gogoproto.nullable) = false];
  
  // Creator of the token
  string creator = 9;
}

// WalletDistribution defines how initial tokens are distributed
message WalletDistribution {
  option (gogoproto.equal) = true;
  
  string address = 1;
  string percent = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}

// TokenTax defines tax configuration for token transactions
message TokenTax {
  option (gogoproto.equal) = true;
  
  string percent = 1 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string recipient_address = 2;
}