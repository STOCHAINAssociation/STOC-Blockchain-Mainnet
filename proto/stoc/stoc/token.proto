syntax = "proto3";
package stoc.stoc;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";

option go_package = "stoc/x/stoc/types";

// Token represents a fungible token on the STOC blockchain
message Token {
  option (gogoproto.equal) = true;
  string id = 1 ;
  string name = 2;
  string symbol = 3 [(gogoproto.moretags) = "yaml:\"symbol\""];
  string initial_supply = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int", 
    (gogoproto.nullable) = false
  ];
  string total_supply = 5 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  uint32 decimals = 6;
  string logo = 7;
  
  // Wallet distributions for initial supply
  repeated WalletDistribution distributions = 8 [(gogoproto.nullable) = false];
  
  // Tax configuration
  TokenTax tax = 9 [(gogoproto.nullable) = false];
  
  // Creator of the token
  string creator = 10;

  // Remaining supply of the token
  string remaining_supply = 11 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  bool unlimited = 12;

  string minimal_denom = 13;
}

// WalletDistribution defines how initial tokens are distributed
message WalletDistribution {
  option (gogoproto.equal) = true;
  
  string address = 1;
  uint32 percent = 2;
}

// TokenTax defines tax configuration for token transactions
message TokenTax {
  option (gogoproto.equal) = true;
  
  string percent = 1 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string recipient_address = 2;
}