{"id":"stoc","consumes":["application/json"],"produces":["application/json"],"swagger":"2.0","info":{"description":"Chain stoc REST API","title":"HTTP API Console","contact":{"name":"stoc"},"version":"version not set"},"paths":{"/cosmos.evm.vm.v1.Msg/RegisterPreinstalls":{"post":{"tags":["Msg"],"summary":"RegisterPreinstalls defines a governance operation for directly registering\npreinstalled contracts in the EVM. The authority is the same as is used for\nParams updates.","operationId":"Erc20Msg_RegisterPreinstalls","parameters":[{"description":"MsgRegisterPreinstalls defines a Msg for creating preinstalls in evm state.","name":"body","in":"body","required":true,"schema":{"$ref":"#/definitions/cosmos.evm.vm.v1.MsgRegisterPreinstalls"}}],"responses":{"200":{"description":"A successful response.","schema":{"$ref":"#/definitions/cosmos.evm.vm.v1.MsgRegisterPreinstallsResponse"}},"default":{"description":"An unexpected error response.","schema":{"$ref":"#/definitions/google.rpc.Status"}}}}},"/cosmos.evm.vm.v1.Msg/UpdateParams":{"post":{"tags":["Msg"],"summary":"UpdateParams defined a governance operation for updating the x/vm module\nparameters. The authority is hard-coded to the Cosmos SDK x/gov module\naccount","operationId":"Erc20Msg_UpdateParams","parameters":[{"description":"MsgUpdateParams defines a Msg for updating the x/vm module parameters.","name":"body","in":"body","required":true,"schema":{"$ref":"#/definitions/cosmos.evm.vm.v1.MsgUpdateParams"}}],"responses":{"200":{"description":"A successful response.","schema":{"$ref":"#/definitions/cosmos.evm.vm.v1.MsgUpdateParamsResponse"}},"default":{"description":"An unexpected error response.","schema":{"$ref":"#/definitions/google.rpc.Status"}}}}},"/cosmos/evm/vm/v1/ethereum_tx":{"post":{"tags":["Msg"],"summary":"EthereumTx defines a method submitting Ethereum transactions.","operationId":"Erc20Msg_EthereumTx","parameters":[{"type":"string","format":"byte","description":"from is the bytes of ethereum signer address. This address value is checked\nagainst the address derived from the signature (V, R, S) using the\nsecp256k1 elliptic curve","name":"from","in":"query"},{"type":"string","format":"byte","description":"raw is the raw ethereum transaction","name":"raw","in":"query"}],"responses":{"200":{"description":"A successful response.","schema":{"$ref":"#/definitions/cosmos.evm.vm.v1.MsgEthereumTxResponse"}},"default":{"description":"An unexpected error response.","schema":{"$ref":"#/definitions/google.rpc.Status"}}}}},"/stoc.stoc.Msg/BurnToken":{"post":{"tags":["Msg"],"summary":"BurnToken burns tokens","operationId":"StocMsg_BurnToken","parameters":[{"name":"body","in":"body","required":true,"schema":{"$ref":"#/definitions/stoc.stoc.MsgBurnToken"}}],"responses":{"200":{"description":"A successful response.","schema":{"$ref":"#/definitions/stoc.stoc.MsgBurnTokenResponse"}},"default":{"description":"An unexpected error response.","schema":{"$ref":"#/definitions/google.rpc.Status"}}}}},"/stoc.stoc.Msg/CreateToken":{"post":{"tags":["Msg"],"summary":"CreateToken creates a new token","operationId":"StocMsg_CreateToken","parameters":[{"name":"body","in":"body","required":true,"schema":{"$ref":"#/definitions/stoc.stoc.MsgCreateToken"}}],"responses":{"200":{"description":"A successful response.","schema":{"$ref":"#/definitions/stoc.stoc.MsgCreateTokenResponse"}},"default":{"description":"An unexpected error response.","schema":{"$ref":"#/definitions/google.rpc.Status"}}}}},"/stoc.stoc.Msg/MintTokens":{"post":{"tags":["Msg"],"summary":"MintTokens mints tokens to a recipient","operationId":"StocMsg_MintTokens","parameters":[{"name":"body","in":"body","required":true,"schema":{"$ref":"#/definitions/stoc.stoc.MsgMintTokens"}}],"responses":{"200":{"description":"A successful response.","schema":{"$ref":"#/definitions/stoc.stoc.MsgMintTokensResponse"}},"default":{"description":"An unexpected error response.","schema":{"$ref":"#/definitions/google.rpc.Status"}}}}},"/stoc.stoc.Msg/ReleaseTokens":{"post":{"tags":["Msg"],"summary":"ReleaseTokens releases tokens to a recipient","operationId":"StocMsg_ReleaseTokens","parameters":[{"name":"body","in":"body","required":true,"schema":{"$ref":"#/definitions/stoc.stoc.MsgReleaseTokens"}}],"responses":{"200":{"description":"A successful response.","schema":{"$ref":"#/definitions/stoc.stoc.MsgReleaseTokensResponse"}},"default":{"description":"An unexpected error response.","schema":{"$ref":"#/definitions/google.rpc.Status"}}}}},"/stoc.stoc.Msg/UpdateParams":{"post":{"tags":["Msg"],"summary":"UpdateParams defines a (governance) operation for updating the module\nparameters. The authority defaults to the x/gov module account.","operationId":"StocMsg_UpdateParams","parameters":[{"description":"MsgUpdateParams is the Msg/UpdateParams request type.","name":"body","in":"body","required":true,"schema":{"$ref":"#/definitions/stoc.stoc.MsgUpdateParams"}}],"responses":{"200":{"description":"A successful response.","schema":{"$ref":"#/definitions/stoc.stoc.MsgUpdateParamsResponse"}},"default":{"description":"An unexpected error response.","schema":{"$ref":"#/definitions/google.rpc.Status"}}}}}},"definitions":{"cosmos.evm.vm.v1.AccessControl":{"type":"object","title":"AccessControl defines the permission policy of the EVM\nfor creating and calling contracts","properties":{"call":{"title":"call defines the permission policy for calling contracts","$ref":"#/definitions/cosmos.evm.vm.v1.AccessControlType"},"create":{"title":"create defines the permission policy for creating contracts","$ref":"#/definitions/cosmos.evm.vm.v1.AccessControlType"}}},"cosmos.evm.vm.v1.AccessControlType":{"type":"object","title":"AccessControlType defines the permission type for policies","properties":{"access_control_list":{"type":"array","title":"access_control_list defines defines different things depending on the\nAccessType:\n- ACCESS_TYPE_PERMISSIONLESS: list of addresses that are blocked from\nperforming the operation\n- ACCESS_TYPE_RESTRICTED: ignored\n- ACCESS_TYPE_PERMISSIONED: list of addresses that are allowed to perform\nthe operation","items":{"type":"string"}},"access_type":{"title":"access_type defines which type of permission is required for the operation","$ref":"#/definitions/cosmos.evm.vm.v1.AccessType"}}},"cosmos.evm.vm.v1.AccessType":{"description":"- ACCESS_TYPE_PERMISSIONLESS: ACCESS_TYPE_PERMISSIONLESS does not restrict the operation to anyone\n - ACCESS_TYPE_RESTRICTED: ACCESS_TYPE_RESTRICTED restrict the operation to anyone\n - ACCESS_TYPE_PERMISSIONED: ACCESS_TYPE_PERMISSIONED only allows the operation for specific addresses","type":"string","title":"AccessType defines the types of permissions for the operations","default":"ACCESS_TYPE_PERMISSIONLESS","enum":["ACCESS_TYPE_PERMISSIONLESS","ACCESS_TYPE_RESTRICTED","ACCESS_TYPE_PERMISSIONED"]},"cosmos.evm.vm.v1.Log":{"description":"Log represents an protobuf compatible Ethereum Log that defines a contract\nlog event. These events are generated by the LOG opcode and stored/indexed by\nthe node.\n\nNOTE: address, topics and data are consensus fields. The rest of the fields\nare derived, i.e. filled in by the nodes, but not secured by consensus.","type":"object","properties":{"address":{"type":"string","title":"address of the contract that generated the event"},"block_hash":{"type":"string","title":"block_hash of the block in which the transaction was included"},"block_number":{"type":"string","format":"uint64","title":"block_number of the block in which the transaction was included"},"data":{"type":"string","format":"byte","title":"data which is supplied by the contract, usually ABI-encoded"},"index":{"type":"string","format":"uint64","title":"index of the log in the block"},"removed":{"description":"removed is true if this log was reverted due to a chain\nreorganisation. You must pay attention to this field if you receive logs\nthrough a filter query.","type":"boolean"},"topics":{"description":"topics is a list of topics provided by the contract.","type":"array","items":{"type":"string"}},"tx_hash":{"type":"string","title":"tx_hash is the transaction hash"},"tx_index":{"type":"string","format":"uint64","title":"tx_index of the transaction in the block"}}},"cosmos.evm.vm.v1.MsgEthereumTxResponse":{"description":"MsgEthereumTxResponse defines the Msg/EthereumTx response type.","type":"object","properties":{"gas_used":{"type":"string","format":"uint64","title":"gas_used specifies how much gas was consumed by the transaction"},"hash":{"type":"string","title":"hash of the ethereum transaction in hex format. This hash differs from the\nCometBFT sha256 hash of the transaction bytes. See\nhttps://github.com/tendermint/tendermint/issues/6539 for reference"},"logs":{"description":"logs contains the transaction hash and the proto-compatible ethereum\nlogs.","type":"array","items":{"type":"object","$ref":"#/definitions/cosmos.evm.vm.v1.Log"}},"ret":{"type":"string","format":"byte","title":"ret is the returned data from evm function (result or data supplied with\nrevert opcode)"},"vm_error":{"type":"string","title":"vm_error is the error returned by vm execution"}}},"cosmos.evm.vm.v1.MsgRegisterPreinstalls":{"description":"MsgRegisterPreinstalls defines a Msg for creating preinstalls in evm state.","type":"object","properties":{"authority":{"description":"authority is the address of the governance account.","type":"string"},"preinstalls":{"description":"preinstalls defines the preinstalls to create.","type":"array","items":{"type":"object","$ref":"#/definitions/cosmos.evm.vm.v1.Preinstall"}}}},"cosmos.evm.vm.v1.MsgRegisterPreinstallsResponse":{"description":"MsgRegisterPreinstallsResponse defines the response structure for executing a\nMsgRegisterPreinstalls message.","type":"object"},"cosmos.evm.vm.v1.MsgUpdateParams":{"description":"MsgUpdateParams defines a Msg for updating the x/vm module parameters.","type":"object","properties":{"authority":{"description":"authority is the address of the governance account.","type":"string"},"params":{"description":"params defines the x/vm parameters to update.\nNOTE: All parameters must be supplied.","$ref":"#/definitions/cosmos.evm.vm.v1.Params"}}},"cosmos.evm.vm.v1.MsgUpdateParamsResponse":{"description":"MsgUpdateParamsResponse defines the response structure for executing a\nMsgUpdateParams message.","type":"object"},"cosmos.evm.vm.v1.Params":{"type":"object","title":"Params defines the EVM module parameters","properties":{"access_control":{"title":"access_control defines the permission policy of the EVM","$ref":"#/definitions/cosmos.evm.vm.v1.AccessControl"},"active_static_precompiles":{"type":"array","title":"active_static_precompiles defines the slice of hex addresses of the\nprecompiled contracts that are active","items":{"type":"string"}},"evm_channels":{"type":"array","title":"evm_channels is the list of channel identifiers from EVM compatible chains","items":{"type":"string"}},"evm_denom":{"description":"evm_denom represents the token denomination used to run the EVM state\ntransitions.","type":"string"},"extra_eips":{"type":"array","title":"extra_eips defines the additional EIPs for the vm.Config","items":{"type":"string","format":"int64"}},"history_serve_window":{"type":"string","format":"uint64"}}},"cosmos.evm.vm.v1.Preinstall":{"type":"object","title":"Preinstall defines a contract that is preinstalled on-chain with a specific\ncontract address and bytecode","properties":{"address":{"type":"string","title":"address in hex format of the preinstall contract"},"code":{"type":"string","title":"code in hex format for the preinstall contract"},"name":{"type":"string","title":"name of the preinstall contract"}}},"google.protobuf.Any":{"type":"object","properties":{"@type":{"type":"string"}},"additionalProperties":{}},"google.rpc.Status":{"type":"object","properties":{"code":{"type":"integer","format":"int32"},"details":{"type":"array","items":{"type":"object","$ref":"#/definitions/google.protobuf.Any"}},"message":{"type":"string"}}},"stoc.stoc.MsgBurnToken":{"type":"object","properties":{"amount":{"type":"string"},"burn_all":{"type":"boolean"},"creator":{"type":"string"},"denom":{"type":"string"}}},"stoc.stoc.MsgBurnTokenResponse":{"type":"object","properties":{"message":{"type":"string"},"success":{"type":"boolean"}}},"stoc.stoc.MsgCreateToken":{"type":"object","title":"MsgCreateToken defiends the message for creating a new token","properties":{"creator":{"type":"string"},"decimals":{"type":"integer","format":"int64"},"distributions":{"type":"array","items":{"type":"object","$ref":"#/definitions/stoc.stoc.WalletDistribution"}},"initial_supply":{"type":"string"},"logo":{"type":"string"},"name":{"type":"string"},"symbol":{"type":"string"},"tax":{"$ref":"#/definitions/stoc.stoc.TokenTax"},"total_supply":{"type":"string"},"unlimited":{"type":"boolean"}}},"stoc.stoc.MsgCreateTokenResponse":{"type":"object","properties":{"creator":{"type":"string"},"message":{"type":"string"},"success":{"type":"boolean"},"symbol":{"type":"string"}}},"stoc.stoc.MsgMintTokens":{"type":"object","properties":{"amount":{"type":"string"},"creator":{"type":"string"},"symbol":{"type":"string"}}},"stoc.stoc.MsgMintTokensResponse":{"type":"object","properties":{"amount":{"type":"string"},"message":{"type":"string"},"recipient":{"type":"string"},"success":{"type":"boolean"},"symbol":{"type":"string"}}},"stoc.stoc.MsgReleaseTokens":{"type":"object","properties":{"amount":{"type":"string"},"creator":{"type":"string"},"recipient":{"type":"string"},"symbol":{"type":"string"}}},"stoc.stoc.MsgReleaseTokensResponse":{"type":"object","properties":{"amount":{"type":"string"},"message":{"type":"string"},"recipient":{"type":"string"},"success":{"type":"boolean"},"symbol":{"type":"string"}}},"stoc.stoc.MsgUpdateParams":{"description":"MsgUpdateParams is the Msg/UpdateParams request type.","type":"object","properties":{"authority":{"description":"authority is the address that controls the module (defaults to x/gov unless overwritten).","type":"string"},"params":{"description":"params defines the module parameters to update.\n\nNOTE: All parameters must be supplied.","$ref":"#/definitions/stoc.stoc.Params"}}},"stoc.stoc.MsgUpdateParamsResponse":{"description":"MsgUpdateParamsResponse defines the response structure for executing a\nMsgUpdateParams message.","type":"object"},"stoc.stoc.Params":{"description":"Params defines the parameters for the module.","type":"object"},"stoc.stoc.TokenTax":{"type":"object","title":"TokenTax defines tax configuration for token transactions","properties":{"percent":{"type":"string"},"recipient_address":{"type":"string"}}},"stoc.stoc.WalletDistribution":{"type":"object","title":"WalletDistribution defines how initial tokens are distributed","properties":{"address":{"type":"string"},"percent":{"type":"integer","format":"int64"}}}},"tags":[{"name":"Msg"}]}