validation: sovereign
version: 1
build:
  binary: stocd
  proto:
    path: ""
accounts:
  - name: admin
    coins:
      - 10000000000000000ustoc
  - name: validator1
    coins:
      - 11000000000ustoc
  - name: validator2
    coins:
      - 11000000000ustoc
faucet:
  name: admin
  coins:
    - 100000ustoc
  openapi:
    path: docs/static/openapi.yml
genesis:
  app_state:
    crisis:
      constant_fee:
        denom: ustoc
    staking:
      params:
        bond_denom: ustoc
    feemarket:
      params:
        no_base_fee: true
        base_fee: "0"
        min_gas_price: "0.000000000000000000"
        min_gas_multiplier: "0.500000000000000000"
        base_fee_change_denominator: 8
        elasticity_multiplier: 2
    evm:
      params:
        evm_denom: ustoc
        extended_denom_options:
          extended_denom: astoc
    bank:
      denom_metadata:
        - base: ustoc
          display: stoc
          denom_units:
            - denom: ustoc
              exponent: 0
            - denom: stoc
              exponent: 6
          name: STOC
          symbol: STOC
validators:
  - name: validator1
    bonded: 10000000000ustoc
    app:
      minimum-gas-prices: 0.0001ustoc
  - name: validator2
    bonded: 10000000000ustoc
    app:
      minimum-gas-prices: 0.0001ustoc
